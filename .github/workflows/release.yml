name: Release

on:
  push:
    branches: [main]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto | beta | release'
        type: choice
        options: [auto, beta, release]
        default: auto
      dry_run:
        description: 'true => compute + build only; no tag push, no release, no publish'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    # Beta tags are pushed with an app token and re-trigger on: push: tags.
    # Guard the release path so it runs only for FINAL tags (no '-' prerelease suffix).
    if: ${{ !(github.ref_type == 'tag' && contains(github.ref_name, '-')) }}
    uses: dobbo-ca/.github/.github/workflows/release-go.yml@v1
    with:
      mode: ${{ inputs.mode || 'auto' }}
      dry-run: ${{ inputs.dry_run || false }}
      go-version: '1.26'
      binary-name: jt
      cmd-path: .
      version-pkg: main
      build-matrix: '[{"goos":"linux","goarch":"amd64"},{"goos":"linux","goarch":"arm64"},{"goos":"darwin","goarch":"amd64"},{"goos":"darwin","goarch":"arm64"}]'
      asset-name-template: 'jt-{version}-{goos}-{goarch}'
    secrets:
      app-id: ${{ vars.GH_PUB_APP_CLIENT_ID }}
      app-pem: ${{ secrets.GH_PUB_APP_PEM }}

  update-homebrew:
    needs: release
    if: needs.release.outputs.is_release == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GH_PUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_PUB_APP_PEM }}
          owner: dobbo-ca
          repositories: homebrew-taps

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract SHA256 Checksums
        id: checksums
        run: |
          mkdir -p checksums
          find artifacts -name "*.sha256" -exec cp {} checksums/ \;

          echo "darwin_amd64=$(cat checksums/jt-*-darwin-amd64.tar.gz.sha256)" >> $GITHUB_OUTPUT
          echo "darwin_arm64=$(cat checksums/jt-*-darwin-arm64.tar.gz.sha256)" >> $GITHUB_OUTPUT
          echo "linux_amd64=$(cat checksums/jt-*-linux-amd64.tar.gz.sha256)" >> $GITHUB_OUTPUT
          echo "linux_arm64=$(cat checksums/jt-*-linux-arm64.tar.gz.sha256)" >> $GITHUB_OUTPUT

      - name: Trigger Homebrew Tap Update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: dobbo-ca/homebrew-taps
          event-type: update-formula
          client-payload: |
            {
              "formula": "jt",
              "version": "${{ needs.release.outputs.version }}",
              "darwin_amd64_sha": "${{ steps.checksums.outputs.darwin_amd64 }}",
              "darwin_arm64_sha": "${{ steps.checksums.outputs.darwin_arm64 }}",
              "linux_amd64_sha": "${{ steps.checksums.outputs.linux_amd64 }}",
              "linux_arm64_sha": "${{ steps.checksums.outputs.linux_arm64 }}"
            }
